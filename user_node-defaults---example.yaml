# Overrides for node options
#
# To customize this list:
#
# 1. Duplicate this file.
# 2. Remove the ---example suffix (making it: 'user_node-defaults.yaml')
# 3. Edit the list below. New value must be same value type (eg: integer, float, string, etc)
# 4. Restart ComfyUI.

# Nodes focused on images
nodes_image:


  # Shared by various nodes
  shared:
    width: 512
    height: 512
    megapixels: 1.0
    megapixel_priority: 1.0
    multiplier: 1.0
    multiple_of: 32


  # Node: Resize Image/Mask Alt
  resize_image_mask_alt:

    # 'smart resize' resize type
    smart_resize:
      # Aspect Ratio options must begin with 'width:height'
      # Optional descriptive text may follow.
      aspect_ratios:
        - 1:1 (Square)
        - 2:3 (Portrait Photo)
        - 3:2 (Photo)
        - 3:4 (Portrait Standard)
        - 4:3 (Standard)
        - 9:16 (Portrait Widescreen)
        - 16:9 (Widescreen)
        - 9:21 (Portrait Ultrawide)
        - 21:9 (Ultrawide)

    # 'scale (shorter/longer) dimension' resize types
    scale_x_dimension:
      longer_size: 512
      shorter_size: 512

    # 'scale to multiple' resize type
    scale_to_multiple:
      multiple: 8


# Nodes focused on videos
nodes_videos:

  # Node: Load Videos From Folder List Alt
  load_videos_from_folder_list:
    video: "X://insert/path/" # default path to folder
    add_label: False          # True / False


# Nodes focused on batching
nodes_batching:

  # Node: Merge Image Batch List Alt
  merge_image_batch_list:
    overlap: 13
    overlap_side: source       # source / new_images
    overlap_mode: linear_blend # cut / linear_blend / ease_in_out / filmic_crossfade / perceptual_crossfade